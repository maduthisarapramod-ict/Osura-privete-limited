<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Osura Stock Manager</title>
<style>
:root{--p:#4f46e5;--p2:#7c3aed;--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--ok:#16a34a;--bad:#dc2626;--bd:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
header{background:linear-gradient(120deg,var(--p),var(--p2));color:#fff;padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:19px;letter-spacing:.5px}
header small{opacity:.9;display:block;font-size:12px}
.nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.nav button{border:0;background:#eef2ff;color:var(--p);padding:8px 14px;border-radius:999px;font-weight:600;cursor:pointer}
.nav button.on{background:var(--p);color:#fff}
main{padding:16px;max-width:1250px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2,.card h3{margin:0 0 12px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stat{border-radius:12px;padding:14px;color:#fff}
.stat b{display:block;font-size:20px;margin-top:4px}
.s1{background:linear-gradient(135deg,#0ea5e9,#2563eb)}.s2{background:linear-gradient(135deg,#f97316,#dc2626)}.s3{background:linear-gradient(135deg,#22c55e,#15803d)}.s4{background:linear-gradient(135deg,#a855f7,#6d28d9)}.s5{background:linear-gradient(135deg,#14b8a6,#0f766e)}.s6{background:linear-gradient(135deg,#64748b,#334155)}
input,select,textarea{padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;width:100%;background:#fff}
input[type=number]{text-align:right}
label{font-size:13px;color:var(--mu);font-weight:600;display:block;margin-bottom:4px}
.btn{border:0;background:var(--p);color:#fff;padding:10px 16px;border-radius:9px;font-weight:600;cursor:pointer;font-size:14px}
.btn.g{background:var(--ok)}.btn.r{background:var(--bad)}.btn.o{background:#fff;color:var(--p);border:1px solid var(--p)}.btn.sm{padding:5px 10px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.row>div{flex:1;min-width:130px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 9px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{background:#f8fafc;color:var(--mu);font-size:12px;text-transform:uppercase}
tr.tot td{font-weight:700;background:#f8fafc}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle;border:1px solid #0003}
.neg{color:var(--bad);font-weight:700}.pos{color:var(--ok);font-weight:700}
.warn input{border-color:var(--bad);background:#fef2f2}
.bar{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--p),var(--p2));min-width:3px}
.login{max-width:400px;margin:8vh auto;padding:0 16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:99}
.muted{color:var(--mu);font-size:13px}
.shopc{cursor:pointer;border:1px solid var(--bd);border-radius:12px;padding:12px;background:#fff;line-height:1.6}
.shopc:hover{border-color:var(--p);box-shadow:0 2px 8px #4f46e526}
.rep{border:1px dashed #cbd5e1;border-radius:10px;padding:14px;background:#fff}
.rep h2{margin:0 0 4px}.rep h3{margin:14px 0 6px}.rep .sub{color:#475569;margin-bottom:4px}
.stk{display:flex;flex-wrap:wrap;gap:10px}
.stk div{flex:1;min-width:150px;border:1px solid var(--bd);border-radius:10px;padding:10px;background:#fafafa}
.stk b{display:block;font-size:17px;margin-top:2px}
.pq{display:flex;gap:6px}.pq input{width:78px}
#printArea{display:none}
@media print{
 body{background:#fff}
 #app,#toast{display:none!important}
 #printArea{display:block!important;padding:10px}
 table{font-size:12px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>
<div id="toast"></div>
<script>
const SHOPS=['Walasmulla','Hakmana','Kirinda','Thihagoda','Weligama','Imaduwa','Ahangama','Rakwana','Pelmadulla','Eheliyagoda','Kamburupitiya','Kahawaththa'];
const KEY='osura_stock_v2';
const CO='Osura (Pvt) Ltd';
const MIN='0000-00-00',MAX='9999-99-99';

function defDB(){return{v:2,
 settings:{pack:25,cats:[{k:'red',n:'Red',h:'#e53935',price:300},{k:'white',n:'White',h:'#bdbdbd',price:300},{k:'yellow',n:'Yellow',h:'#f9a825',price:250},{k:'green',n:'Green',h:'#2e7d32',price:350}],adminUser:'osura shop',adminPass:'Osura2026'},
 shops:SHOPS.map((n,i)=>({id:'s'+(i+1),name:n,pin:'1234'})),
 transfers:[],days:{},log:[]}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.settings&&d.settings.cats){if(!d.log)d.log=[];return d}}catch(e){}return defDB()}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){alert('Could not save to browser storage. Please download a backup.')}schedPush()}

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n0=x=>Number(x||0).toLocaleString('en-US');
const rs=x=>'Rs. '+Number(x||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const today=()=>new Date().toLocaleDateString('en-CA');
const cls=x=>x<0?'neg':'pos';
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
const dot=c=>`<span class="dot" style="background:${c.h}"></span>`;
let DB=load();
const C=()=>DB.settings.cats;
const PK=()=>DB.settings.pack||25;
const shopName=id=>(DB.shops.find(s=>s.id===id)||{}).name||id;
const stamp=()=>'Generated: '+new Date().toLocaleString('en-GB');

/* quantity helpers (everything stored in single guli) */
function fq(n){n=Math.round(n||0);const neg=n<0;n=Math.abs(n);const p=Math.floor(n/PK()),g=n%PK(),a=[];if(p)a.push(p+' pk');if(g||!p)a.push(g+' g');return(neg?'-':'')+a.join(' ')}
function fqL(n){n=Math.round(n||0);const neg=n<0;n=Math.abs(n);const p=Math.floor(n/PK()),g=n%PK(),a=[];if(p)a.push(p+(p>1?' packs':' pack'));if(g||!p)a.push(g+' guli');return(neg?'-':'')+a.join(' ')}
const sumO=o=>C().reduce((s,c)=>s+(+o[c.k]||0),0);
const zero=()=>{const o={};C().forEach(c=>o[c.k]=0);return o};
const curPrices=()=>{const o={};C().forEach(c=>o[c.k]=+c.price||0);return o};

let S=null;try{S=JSON.parse(sessionStorage.getItem('osura_sess')||'null')}catch(e){}
let ui={tab:'dash',date:today(),shop:null,draft:null,rankP:'day',rankBy:'sales',rFrom:today(),rTo:today(),repMode:'day',lmode:'admin'};

/* ---------- calculations ---------- */
function recCalc(r){const pr=(r.pr&&r.pr.prices)||curPrices(),cur=curPrices(),per={};let sales=0;C().forEach(c=>{const p=pr[c.k]!=null?pr[c.k]:cur[c.k];per[c.k]=r2((+r.sold[c.k]||0)*p);sales+=per[c.k]});return{per,sales:r2(sales),pr:Object.assign({},cur,pr)}}
const expTot=r=>r2((r.exp||[]).reduce((s,e)=>s+(+e.a||0),0));
function sumTr(shop,pred){const o=zero();DB.transfers.forEach(t=>{if(t.shop===shop&&pred(t.date))C().forEach(c=>o[c.k]+=+t.qty[c.k]||0)});return o}
function sumSold(shop,pred){const o=zero();Object.values(DB.days).forEach(r=>{if(r.shop===shop&&pred(r.date))C().forEach(c=>o[c.k]+=+r.sold[c.k]||0)});return o}
function stk(shop,date){const trB=sumTr(shop,d=>d<date),trD=sumTr(shop,d=>d===date),sB=sumSold(shop,d=>d<date),sD=sumSold(shop,d=>d===date);
 const open={},recv={},sold={},close={};C().forEach(c=>{const k=c.k;open[k]=trB[k]-sB[k];recv[k]=trD[k];sold[k]=sD[k];close[k]=open[k]+recv[k]-sD[k]});return{open,recv,sold,close}}
function agg(shop,from,to){
 const tB=sumTr(shop,d=>d<from),sB=sumSold(shop,d=>d<from),recv=sumTr(shop,d=>d>=from&&d<=to),sold=zero(),amt=zero(),open={},close={};
 let sales=0,exp=0;
 Object.values(DB.days).forEach(r=>{if(r.shop===shop&&r.date>=from&&r.date<=to){const cc=recCalc(r);C().forEach(c=>{sold[c.k]+=+r.sold[c.k]||0;amt[c.k]+=cc.per[c.k]});sales+=cc.sales;exp+=expTot(r)}});
 C().forEach(c=>{open[c.k]=tB[c.k]-sB[c.k];close[c.k]=open[c.k]+recv[c.k]-sold[c.k];amt[c.k]=r2(amt[c.k])});
 sales=r2(sales);exp=r2(exp);
 return{open,recv,sold,close,amt,sales,exp,bal:r2(sales-exp),openT:sumO(open),recvT:sumO(recv),soldT:sumO(sold),closeT:sumO(close)}}
function range(){const d=ui.date,p=ui.rankP;if(p==='day')return[d,d];if(p==='month')return[d.slice(0,7)+'-01',d.slice(0,7)+'-31'];if(p==='year')return[d.slice(0,4)+'-01-01',d.slice(0,4)+'-12-31'];if(p==='all')return[MIN,MAX];return[ui.rFrom,ui.rTo]}
function allAgg(from,to){return DB.shops.map(s=>Object.assign({shop:s},agg(s.id,from,to)))}
function totals(rows){const t={open:zero(),recv:zero(),sold:zero(),close:zero(),amt:zero(),sales:0,exp:0,bal:0,openT:0,recvT:0,soldT:0,closeT:0};
 rows.forEach(r=>{C().forEach(c=>{['open','recv','sold','close','amt'].forEach(f=>t[f][c.k]+=r[f][c.k])});t.sales+=r.sales;t.exp+=r.exp;['openT','recvT','soldT','closeT'].forEach(f=>t[f]+=r[f])});
 t.sales=r2(t.sales);t.exp=r2(t.exp);t.bal=r2(t.sales-t.exp);return t}

/* ---------- cloud sync (Firebase Realtime Database, REST) ----------
   Paste your Firebase Realtime Database URL below, e.g.
   https://your-project-default-rtdb.firebaseio.com
   Leave as is to keep working only on this device (old behaviour). */
const FB_URL='PASTE_YOUR_FIREBASE_URL_HERE';
const CLOUD=/^https:\/\//.test(FB_URL);
const FB=FB_URL.replace(/\/+$/,'')+'/osura';
const LASTK='osura_last_v1';
let ready=false,pulling=null,pushing=false,pushT=null,LAST=null;
let syncMsg=CLOUD?'Connecting...':'Cloud not set up - data on this device only';
try{LAST=JSON.parse(localStorage.getItem(LASTK))}catch(e){}
function saveLast(){try{localStorage.setItem(LASTK,JSON.stringify(LAST))}catch(e){}}
function errMsg(e,rd){const m=String(e&&e.message||e);if(/HTTP 40[13]/.test(m))return 'Cloud blocked ('+m+') - set Firebase Rules to allow read and write';if(/HTTP 404/.test(m))return 'Cloud URL looks wrong ('+m+')';return(rd?'Offline - will retry':'Offline - showing data saved on this device')+' ['+m+']'}
function updSync(){const e=$('sync');if(e)e.textContent=syncMsg}
const hh=s=>{let x=5381;for(let i=0;i<s.length;i++)x=((x*33)^s.charCodeAt(i))|0;return x+':'+s.length};
function canon(v){
 if(Array.isArray(v)){if(!v.length)return undefined;return v.map(x=>{const c=canon(x);return c===undefined?null:c})}
 if(v&&typeof v==='object'){const o={};Object.keys(v).sort().forEach(k=>{const c=canon(v[k]);if(c!==undefined&&c!==null)o[k]=c});return o}
 return v}
const J=x=>JSON.stringify(canon(x));
function flat(db){const f={};f['settings']=J(db.settings);f['shops']=J(db.shops);
 db.transfers.forEach(t=>f['transfers/'+t.id]=J(t));
 (db.log||[]).forEach(l=>f['log/'+l.id]=J(l));
 Object.keys(db.days).forEach(k=>f['days/'+k]=J(db.days[k]));return f}
function remFlat(r){const f={};if(!r)return f;
 if(r.settings)f.settings=J(r.settings);if(r.shops)f.shops=J(r.shops);
 Object.keys(r.transfers||{}).forEach(k=>f['transfers/'+k]=J(r.transfers[k]));
 Object.keys(r.log||{}).forEach(k=>f['log/'+k]=J(r.log[k]));
 Object.keys(r.days||{}).forEach(k=>f['days/'+k]=J(r.days[k]));return f}
function buildDB(res){const d={v:2,settings:null,shops:null,transfers:[],days:{},log:[]};
 Object.keys(res).forEach(p=>{const v=JSON.parse(res[p]);
  if(p==='settings')d.settings=v;else if(p==='shops')d.shops=v;
  else if(p.indexOf('transfers/')===0)d.transfers.push(v);
  else if(p.indexOf('log/')===0)d.log.push(v);
  else if(p.indexOf('days/')===0)d.days[p.slice(5)]=v});
 if(!d.settings)d.settings=DB.settings;if(!d.shops)d.shops=DB.shops;
 d.transfers.sort((a,b)=>(a.ts||0)-(b.ts||0));d.log.sort((a,b)=>(a.ts||0)-(b.ts||0));return d}
async function fb(method,path,body){
 const url=FB+(path?'/'+path.split('/').map(encodeURIComponent).join('/'):'')+'.json';
 const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:body});
 if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function runBatch(ops){for(let i=0;i<ops.length;i+=20)await Promise.all(ops.slice(i,i+20).map(o=>o()))}
function pull(){if(!CLOUD)return Promise.resolve(false);if(pulling)return pulling;pulling=doPull().finally(()=>{pulling=null});return pulling}
async function doPull(){
 try{
  const rem=await fb('GET',''),rf=remFlat(rem),lf=flat(DB),first=!LAST,last=LAST||{},dflt=flat(defDB());
  if(first){try{if(!localStorage.getItem(KEY+'_pre'))localStorage.setItem(KEY+'_pre',JSON.stringify(DB))}catch(e){}}
  const res={},ops=[];let changed=false;
  new Set(Object.keys(lf).concat(Object.keys(rf))).forEach(p=>{
   const l=lf[p],r=rf[p],b=last[p];let take;
   if(l===r)take='r';
   else if(first){if(l===undefined)take='r';else if(r===undefined)take='l';else take=((p==='settings'||p==='shops')&&l!==dflt[p])?'l':'r'}
   else if(l===undefined)take=(b!==undefined&&hh(r)===b)?'l':'r';
   else if(r===undefined)take=(b!==undefined&&hh(l)===b)?'r':'l';
   else take=(hh(l)===b)?'r':'l';
   if(take==='r'){if(r!==undefined)res[p]=r;if(l!==r)changed=true}
   else{if(l!==undefined){res[p]=l;ops.push(()=>fb('PUT',p,l))}else ops.push(()=>fb('DELETE',p))}
  });
  await runBatch(ops);
  if(changed){DB=buildDB(res);try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
  const nl={};Object.keys(res).forEach(p=>nl[p]=hh(res[p]));LAST=nl;saveLast();
  ready=true;syncMsg='Synced '+new Date().toLocaleTimeString('en-GB');updSync();return changed;
 }catch(e){syncMsg=errMsg(e,ready);updSync();return false}}
function schedPush(){if(!CLOUD)return;clearTimeout(pushT);pushT=setTimeout(push,600);if(ready){syncMsg='Saving...';updSync()}}
async function push(){
 if(!CLOUD||!ready)return;
 if(pushing){schedPush();return}
 pushing=true;
 try{
  const lf=flat(DB),last=LAST||{},ops=[];
  Object.keys(lf).forEach(p=>{if(hh(lf[p])!==last[p])ops.push(()=>fb('PUT',p,lf[p]))});
  Object.keys(last).forEach(p=>{if(!(p in lf))ops.push(()=>fb('DELETE',p))});
  await runBatch(ops);
  const nl={};Object.keys(lf).forEach(p=>nl[p]=hh(lf[p]));LAST=nl;saveLast();
  syncMsg='Synced '+new Date().toLocaleTimeString('en-GB');
 }catch(e){syncMsg=errMsg(e,true);clearTimeout(pushT);pushT=setTimeout(push,15000)}
 pushing=false;updSync()}
async function syncNow(){if(!CLOUD)return;await push();const ch=await pull();
 if(ch&&S){const a=document.activeElement;if(!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))render()}}
function cloudInit(){if(!CLOUD)return;
 pull().then(ch=>{if(ch&&S)render();else updSync()});
 setInterval(syncNow,30000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()});
 window.addEventListener('online',syncNow)}

/* ---------- auth ---------- */
async function doLogin(){
 if(CLOUD&&!ready){toast('Connecting to cloud...');await pull()}
 if(ui.lmode==='admin'){const u=$('lu').value.trim().toLowerCase(),p=$('lp').value;
  if(u===DB.settings.adminUser.toLowerCase()&&p===DB.settings.adminPass){S={role:'admin'};ui.tab='dash'}else return toast('Wrong username or password')}
 else{const sh=DB.shops.find(s=>s.id===$('ls').value);if(sh&&$('lp').value===sh.pin){S={role:'shop',shop:sh.id};ui.tab='entry';ui.shop=sh.id;ui.draft=null}else return toast('Wrong shop PIN')}
 sessionStorage.setItem('osura_sess',JSON.stringify(S));render()}
function logout(){S=null;sessionStorage.removeItem('osura_sess');ui.draft=null;render()}
function setL(m){ui.lmode=m;render()}

/* ---------- shell ---------- */
function render(){
 if(!S){$('app').innerHTML=loginHTML();return}
 $('app').innerHTML=headHTML()+navHTML()+'<main>'+viewHTML()+'</main>';
 if(ui.tab==='entry')updateEntry();
}
function loginHTML(){
 const a=ui.lmode==='admin';
 return `<div class="login"><div class="card"><h2 style="text-align:center;color:var(--p)">${CO}</h2><p class="muted" style="text-align:center">Stock &amp; Sales Manager</p><p class="muted" id="sync" style="text-align:center;font-size:12px">${esc(syncMsg)}</p>
 <div class="tabs"><button class="btn ${a?'':'o'}" onclick="setL('admin')">Admin</button><button class="btn ${a?'o':''}" onclick="setL('shop')">Shop</button></div>
 ${a?`<label>Username</label><input id="lu" autocomplete="username"><br><br>`:`<label>Shop</label><select id="ls">${DB.shops.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><br><br>`}
 <label>${a?'Password':'Shop PIN'}</label><input id="lp" type="password" onkeydown="if(event.key==='Enter')doLogin()"><br><br>
 <button class="btn" style="width:100%" onclick="doLogin()">Login</button></div></div>`}
function headHTML(){return `<header><div><h1>${CO}</h1><small>${S.role==='admin'?'Admin Panel':'Shop: '+esc(shopName(S.shop))}</small></div><div style="text-align:right"><small id="clk"></small><small id="sync">${esc(syncMsg)}</small><button class="btn sm o" onclick="syncNow()" style="margin-top:4px">Sync</button> <button class="btn sm o" onclick="logout()" style="margin-top:4px">Logout</button></div></header>`}
function navHTML(){
 const t=S.role==='admin'?[['dash','Dashboard'],['entry','Shop Entry'],['transfer','Give Packets'],['details','Shop Details'],['rank','Ranking'],['report','Reports'],['log','Activity Log'],['settings','Settings']]:[['entry','Daily Entry'],['sum','My Summary'],['hist','My History']];
 return `<div class="nav">${t.map(x=>`<button class="${ui.tab===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div>`}
function go(t){ui.tab=t;if(t==='entry')ui.draft=null;render()}
function viewHTML(){const t=ui.tab;
 if(t==='dash')return dashV();if(t==='entry')return entryV();if(t==='transfer')return transferV();if(t==='rank')return rankV();if(t==='report')return reportV();if(t==='settings')return settingsV();if(t==='hist')return histV();if(t==='details')return detailsV(ui.shop||DB.shops[0].id);if(t==='log')return logV();if(t==='sum')return sumV();return''}
setInterval(()=>{const c=$('clk');if(c)c.textContent=new Date().toLocaleString('en-GB')},1000);

/* ---------- dashboard ---------- */
function dashV(){
 const d=ui.date,rows=allAgg(d,d),t=totals(rows),all=totals(allAgg(MIN,MAX));
 return `<div class="card"><div class="row"><div><label>Date</label><input type="date" value="${d}" onchange="ui.date=this.value;render()"></div></div>
 <div class="grid g4">
 <div class="stat s1">Stock received<b>${fqL(t.recvT)}</b></div><div class="stat s4">Sold<b>${fqL(t.soldT)}</b></div>
 <div class="stat s3">Income<b>${rs(t.sales)}</b></div><div class="stat s2">Expenses<b>${rs(t.exp)}</b></div>
 <div class="stat s5">Balance (net)<b>${rs(t.bal)}</b></div><div class="stat s6">Stock left<b>${fqL(t.closeT)}</b></div></div></div>
 <div class="card"><h3>By category — ${d}</h3><div class="tw"><table><thead><tr><th>Category</th><th>Opening</th><th>Received</th><th>Sold</th><th>Income</th><th>Stock left</th></tr></thead><tbody>
 ${C().map(c=>`<tr><td>${dot(c)}${esc(c.n)}</td><td>${fq(t.open[c.k])}</td><td>${fq(t.recv[c.k])}</td><td>${fq(t.sold[c.k])}</td><td>${rs(t.amt[c.k])}</td><td>${fq(t.close[c.k])}</td></tr>`).join('')}

 ensureDraft();const lk=isLocked(),dis=lk?'disabled':'',sh=curShop(),dr=ui.draft,st=stk(sh,ui.date),isSaved=!!DB.days[sh+'|'+ui.date],cur=curPrices();

function addRestock(){if(isLocked())return toast('This day is locked');const sh=curShop(),q={};let tot=0;C().forEach(c=>{const p=Math.max(0,Math.floor(+$('rp_'+c.k).value||0)),g=Math.max(0,Math.floor(+$('rg_'+c.k).value||0));q[c.k]=p*PK()+g;tot+=q[c.k]});

function updateEntry(){
 const dr=ui.draft;if(!dr)return;const cur=curPrices();let q=0,a=0,rem=0,bad=false;
 C().forEach(c=>{const p=Math.max(0,Math.floor(+$('ip_'+c.k).value||0)),g=Math.max(0,Math.floor(+$('ig_'+c.k).value||0)),v=p*PK()+g,av=+$('av_'+c.k).dataset.v,am=r2(v*cur[c.k]);dr.sold[c.k]=v;q+=v;a+=am;
  $('tg_'+c.k).textContent=n0(v);$('am_'+c.k).textContent=rs(am);const rm=av-v;rem+=rm;$('rm_'+c.k).innerHTML=`<span class="${rm<0?'neg':''}">${fq(rm)}</span>`;
  $('tr_'+c.k).className=rm<0?'warn':'';if(rm<0)bad=true});
 a=r2(a);const e=r2(dr.exp.reduce((s,x)=>s+(+x.a||0),0));
 $('t_q').textContent=n0(q);$('t_a').textContent=rs(a);$('t_r').textContent=fq(rem);
 $('sSales').textContent=rs(a);$('sExp').textContent=rs(e);$('sBal').textContent=rs(a-e);$('sRem').textContent=fqL(rem);
 const ex=$('expList');if(ex)ex.innerHTML=expHTML();dr._bad=bad}

 return `<table><tbody>${dr.exp.map((x,i)=>`<tr><td>${esc(x.d)}</td><td>${rs(x.a)}</td><td style="width:60px">${isLocked()?'':`<button class="btn r sm" onclick="delExp(${i})">X</button>`}</td></tr>`).join('')}<tr class="tot"><td>Total</td><td>${rs(dr.exp.reduce((s,x)=>s+(+x.a||0),0))}</td><td></td></tr></tbody></table>`}

 const dr=ui.draft;if(isLocked())return true;if(S.role==='shop'&&dr.date>today()){toast('Cannot enter a future date');return false}updateEntry();
 if(dr._bad){toast('Sold quantity is more than the available stock');return false}
 const key=dr.shop+'|'+dr.date,prevDay=DB.days[key]?JSON.parse(JSON.stringify(DB.days[key])):null;
 DB.days[key]={shop:dr.shop,date:dr.date,sold:Object.assign({},dr.sold),exp:JSON.parse(JSON.stringify(dr.exp)),note:dr.note||'',pr:{prices:curPrices()},saved:Date.now()};
 DB.days[key].sales=recCalc(DB.days[key]).sales;
 {const nd=DB.days[key],inf='Sales '+rs(nd.sales)+', expenses '+rs(expTot(nd));if(!prevDay)addLog('save-day',dr.shop,dr.date,inf,'day',null);else if(J(prevDay.sold)!==J(nd.sold)||J(prevDay.exp)!==J(nd.exp)||(prevDay.note||'')!==(nd.note||''))addLog('edit-day',dr.shop,dr.date,'Old: sales '+rs(recCalc(prevDay).sales)+', exp '+rs(expTot(prevDay))+' -> New: '+inf,'day',prevDay)}
 persist();if(!silent){toast('Saved');render()}return true}

const pdfName=(shop,date)=>'Osura-'+shopName(shop).replace(/\s+/g,'')+'-'+date+'.pdf';

/* ---------- report models ---------- */
function shopDayBlocks(shop,date){
 const r=DB.days[shop+'|'+date]||{sold:{},exp:[]},cc=recCalc(r),st=stk(shop,date),e=expTot(r),pr=cc.pr;
 const rows=C().map(c=>[c.n,fq(st.open[c.k]),fq(st.recv[c.k]),fq(st.open[c.k]+st.recv[c.k]),fq(st.sold[c.k]),rs(pr[c.k]),rs(cc.per[c.k]),fq(st.close[c.k])]);
 rows.push(['TOTAL',fq(sumO(st.open)),fq(sumO(st.recv)),fq(sumO(st.open)+sumO(st.recv)),fq(sumO(st.sold)),'',rs(cc.sales),fq(sumO(st.close))]);
 const B=[{t:'h1',s:CO},{t:'p',s:'Daily Report - '+shopName(shop)+' - '+date},{t:'p',s:stamp()+'   (1 pk = '+PK()+' guli, g = guli)'},
  {t:'h2',s:'Stock & Sales'},{t:'table',head:['Category','Opening stock','Received','Available','Sold','Price/guli','Income','Stock left'],rows,tot:true},
  {t:'h2',s:'Expenses'}];
 if((r.exp||[]).length){B.push({t:'table',head:['Description','Amount'],rows:r.exp.map(x=>[x.d,rs(x.a)]).concat([['TOTAL EXPENSES',rs(e)]]),tot:true})}else B.push({t:'p',s:'No expenses'});
 B.push({t:'h2',s:'Summary'},{t:'table',head:['Item','Amount'],rows:[['Total income (sales)',rs(cc.sales)],['Total expenses',rs(e)],['NET BALANCE',rs(cc.sales-e)],['Stock left',fqL(sumO(st.close))]],tot:true});
 if(r.note)B.push({t:'p',s:'Note: '+r.note});
 return B}
function allBlocks(from,to,title){
 const rows=allAgg(from,to).sort((a,b)=>b.sales-a.sales),t=totals(rows),label=from===to?from:(from===MIN?'All time':from+' to '+to),cur=curPrices();
 const sr=rows.map((r,i)=>[String(i+1),r.shop.name,fq(r.openT),fq(r.recvT),fq(r.soldT),rs(r.sales),rs(r.exp),rs(r.bal),fq(r.closeT)]);
 sr.push(['','TOTAL',fq(t.openT),fq(t.recvT),fq(t.soldT),rs(t.sales),rs(t.exp),rs(t.bal),fq(t.closeT)]);
 const cr=C().map(c=>[c.n,fq(t.open[c.k]),fq(t.recv[c.k]),fq(t.sold[c.k]),rs(t.amt[c.k]),fq(t.close[c.k])]);
 cr.push(['TOTAL',fq(t.openT),fq(t.recvT),fq(t.soldT),rs(t.sales),fq(t.closeT)]);
 return [{t:'h1',s:CO},{t:'p',s:(title||'All Shops Report')+' - '+label},{t:'p',s:stamp()+'   (1 pk = '+PK()+' guli, g = guli)'},
  {t:'h2',s:'By shop (ranked by income)'},{t:'table',head:['#','Shop','Opening stock','Received','Sold','Income','Expenses','Balance','Stock left'],rows:sr,tot:true},
  {t:'h2',s:'By category (all shops)'},{t:'table',head:['Category','Opening stock','Received','Sold','Income','Stock left'],rows:cr,tot:true}]}
function shopDayText(shop,date){
 const r=DB.days[shop+'|'+date]||{sold:{},exp:[]},cc=recCalc(r),st=stk(shop,date),e=expTot(r);
 return `${CO}\nDaily Report - ${shopName(shop)} - ${date}\n\n`+C().map(c=>`${c.n}: received ${fq(st.recv[c.k])}, sold ${fq(st.sold[c.k])} = ${rs(cc.per[c.k])}, left ${fq(st.close[c.k])}`).join('\n')+`\n\nIncome: ${rs(cc.sales)}\nExpenses: ${rs(e)}\nBalance: ${rs(cc.sales-e)}\nStock left: ${fqL(sumO(st.close))}`}
function allText(from,to){const rows=allAgg(from,to).sort((a,b)=>b.sales-a.sales),t=totals(rows);
 return `${CO}\nAll Shops Report ${from===to?from:from+' to '+to}\n\n`+rows.map((r,i)=>`${i+1}. ${r.shop.name}: income ${rs(r.sales)}, exp ${rs(r.exp)}, bal ${rs(r.bal)}, left ${fq(r.closeT)}`).join('\n')+`\n\nTOTAL income ${rs(t.sales)}\nExpenses ${rs(t.exp)}\nBalance ${rs(t.bal)}\nStock left ${fqL(t.closeT)}`}

/* ---------- html / print / pdf / share ---------- */
function blocksHTML(B){return '<div class="rep">'+B.map(b=>{
 if(b.t==='h1')return `<h2>${esc(b.s)}</h2>`;
 if(b.t==='p')return `<div class="sub">${esc(b.s)}</div>`;
 if(b.t==='h2')return `<h3>${esc(b.s)}</h3>`;
 if(b.t==='table')return `<div class="tw"><table><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map((r,i)=>`<tr class="${b.tot&&i===b.rows.length-1?'tot':''}">${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 return''}).join('')+'</div>'}
function doPrint(html){$('printArea').innerHTML=html;setTimeout(()=>window.print(),100)}
function blocksPDF(B){
 const W=842,H=595,M=30,pages=[];let cur,y;
 const np=()=>{cur=[];pages.push(cur);y=H-M};
 const pe=s=>String(s).replace(/[\\()]/g,m=>'\\'+m).replace(/[^\x20-\x7e]/g,'?');
 const T=(x,yy,s,sz,b)=>cur.push(`BT /${b?'F2':'F1'} ${sz} Tf ${x.toFixed(1)} ${yy.toFixed(1)} Td (${pe(s)}) Tj ET`);
 const tw=(s,sz)=>String(s).length*sz*0.55;
 np();
 B.forEach(b=>{
  if(b.t==='h1'){T(M,y-14,b.s,16,1);y-=26}
  else if(b.t==='p'){T(M,y-10,b.s,9,0);y-=14}
  else if(b.t==='h2'){y-=8;if(y<M+60)np();T(M,y-12,b.s,11,1);y-=20}
  else if(b.t==='table'){
   const sz=9,rh=16;
   let w=b.head.map((h,i)=>Math.max(tw(h,sz),...b.rows.map(r=>tw(r[i],sz)))+14);
   const sum=w.reduce((a,c)=>a+c,0),avail=W-2*M;if(sum>avail)w=w.map(x=>x*avail/sum);
   const tot=w.reduce((a,c)=>a+c,0);
   const cell=(x,i,s,bold)=>T(i?x+w[i]-tw(s,sz)-5:x+4,y-11,s,sz,bold);
   const head=()=>{cur.push(`0.9 g ${M} ${y-rh} ${tot.toFixed(1)} ${rh} re f 0 g`);let x=M;b.head.forEach((h,i)=>{cell(x,i,h,1);x+=w[i]});y-=rh};
   if(y<M+70)np();head();
   b.rows.forEach((r,ri)=>{if(y-rh<M){np();head()}const bold=b.tot&&ri===b.rows.length-1;let x=M;r.forEach((c,i)=>{cell(x,i,c,bold);x+=w[i]});cur.push(`0.8 G ${M} ${y-rh} m ${(M+tot).toFixed(1)} ${y-rh} l S`);y-=rh});
   y-=6}
 });
 pages.forEach((p,i)=>{cur=p;T(W-M-60,14,'Page '+(i+1)+' of '+pages.length,8,0)});
 const objs=[],add=s=>{objs.push(s);return objs.length};
 add('<< /Type /Catalog /Pages 2 0 R >>');add('');
 add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>');
 const kids=[];
 pages.forEach(p=>{const c=p.join('\n'),ci=add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`),pi=add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${ci} 0 R >>`);kids.push(pi+' 0 R')});
 objs[1]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;
 let out='%PDF-1.4\n';const off=[];
 objs.forEach((o,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
 const x=out.length;
 out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
 return new Blob([out],{type:'application/pdf'})}
function dlPDF(B,name){const bl=blocksPDF(B),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('PDF downloaded')}
async function sharePDF(B,name,txt){
 const bl=blocksPDF(B),f=new File([bl],name,{type:'application/pdf'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
 dlPDF(B,name);shareText(txt,name)}
function shareText(txt,title){if(navigator.share){navigator.share({title:title,text:txt}).catch(()=>{})}else{window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}}

function delCat(i){readCats();const c=DB.settings.cats[i];const used=DB.transfers.some(t=>t.qty[c.k])||Object.values(DB.days).some(r=>r.sold[c.k]);if(used)return toast('This category has data, so it cannot be deleted');if(DB.settings.cats.length<2)return toast('Keep at least one category');if(!confirm('Delete '+c.n+'?'))return;DB.settings.cats.splice(i,1);persist();render()}
function savePins(){DB.shops.forEach(x=>x.pin=$('pin_'+x.id).value||'1234');persist();toast('PINs saved')}
function saveAdmin(){const u=$('au').value.trim(),p=$('ap').value;if(!u||!p)return toast('Cannot be empty');DB.settings.adminUser=u;DB.settings.adminPass=p;persist();toast('Admin login updated')}
function backup(){const b=new Blob([JSON.stringify(DB)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='osura-backup-'+today()+'.json';a.click()}
function restore(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.settings||!d.settings.cats||!d.shops)throw 0;if(confirm('Replace ALL current data with this backup?')){if(!d.log)d.log=[];DB=d;persist();toast('Restored');render()}}catch(e){toast('Invalid backup file')}};rd.readAsText(f)}

render();
cloudInit();
</script>
</body>
</html>
